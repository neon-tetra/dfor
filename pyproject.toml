[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dfor"
version = "0.1.0"
description = "Build, diagram, and diagnose OR-Tools CP-SAT models as Polars pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["ortools", "polars>=1.24"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/neon-tetra/dfor"

[tool.setuptools]
packages = ["dfor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
